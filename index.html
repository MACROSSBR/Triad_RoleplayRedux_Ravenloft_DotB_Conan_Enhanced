<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ravenloft Triad Wiki</title>
<meta name="description" content="The Triad System — a Ravenloft-inspired d20 RPG: 3 base classes, 9 progressions, 9 hybrids. Occultism, shapeshifters, terrain. Full rulebook wiki.">
<style>/* ============ RAVENLOFT TRIAD WIKI — gothic theme ============ */
:root {
  --bg: #0b0a10;
  --bg2: #12101a;
  --panel: #171422;
  --panel2: #1d1930;
  --line: #2c2740;
  --ink: #d8cfc0;
  --ink-dim: #9a917f;
  --ink-faint: #6f6858;
  --blood: #c0392f;
  --blood-deep: #7e1f1a;
  --veil: #8b7bd8;
  --land: #8a9a5b;
  --gold: #d9a441;
  --bone: #e8e0d0;
  --serif: Georgia, "Palatino Linotype", "Book Antiqua", "Times New Roman", serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(139,123,216,0.07), transparent),
    radial-gradient(ellipse 60% 40% at 90% 110%, rgba(192,57,47,0.05), transparent),
    radial-gradient(ellipse 50% 35% at 5% 100%, rgba(138,154,91,0.04), transparent);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 16.5px;
  line-height: 1.65;
  min-height: 100vh;
}
a { color: var(--gold); text-decoration: none; }
a:hover { color: var(--bone); text-decoration: underline; text-underline-offset: 3px; }
code { font-family: "Courier New", monospace; background: var(--panel2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 4px; font-size: 0.88em; color: var(--bone); }
h1, h2, h3 { font-weight: 600; color: var(--bone); letter-spacing: 0.02em; }
h2 { font-size: 1.45rem; margin: 2.2rem 0 0.8rem; padding-bottom: 0.35rem; border-bottom: 1px solid var(--line); font-variant: small-caps; letter-spacing: 0.06em; }
h3 { font-size: 1.08rem; margin: 1.2rem 0 0.5rem; }
p { margin: 0.65rem 0; }
ul, ol { margin: 0.65rem 0 0.65rem 1.5rem; }
li { margin: 0.3rem 0; }
.dim { color: var(--ink-dim); }
.small { font-size: 0.9rem; }
.note { font-size: 0.92rem; color: var(--ink-dim); border-left: 3px solid var(--line); padding-left: 0.9rem; margin: 1rem 0; }
.warn { color: #ff8f7a; font-weight: bold; }
.lede { font-size: 1.12rem; color: var(--bone); font-style: italic; border-left: 3px solid var(--blood-deep); padding-left: 1rem; margin: 1rem 0 1.6rem; }

/* ---------- layout ---------- */
#layout { display: flex; min-height: 100vh; }
#sidebar {
  width: 290px; flex: 0 0 290px; background: var(--bg2);
  border-right: 1px solid var(--line); padding: 1.2rem 0 3rem;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
#sidebar::-webkit-scrollbar { width: 8px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.side-head { display: flex; align-items: center; gap: 0.7rem; padding: 0 1.1rem 1rem; border-bottom: 1px solid var(--line); margin-bottom: 0.8rem; }
.side-head .sigil { width: 46px; height: 46px; flex: 0 0 46px; }
.side-head b { display: block; color: var(--bone); font-variant: small-caps; letter-spacing: 0.08em; font-size: 1.02rem; line-height: 1.2; }
.side-head span { font-size: 0.72rem; color: var(--ink-faint); letter-spacing: 0.14em; text-transform: uppercase; }
.nav-group { margin: 0.9rem 0; }
.nav-section { font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); padding: 0.25rem 1.1rem; }
#sidebar-nav a { display: block; padding: 0.28rem 1.1rem 0.28rem 1.4rem; color: var(--ink-dim); font-size: 0.93rem; border-left: 2px solid transparent; }
#sidebar-nav a:hover { color: var(--bone); background: rgba(255,255,255,0.025); text-decoration: none; }
#sidebar-nav a.active { color: var(--gold); border-left-color: var(--blood); background: rgba(192,57,47,0.07); }
#sidebar-nav a.nav-hybrid { padding-left: 2.2rem; font-size: 0.88rem; }
#main { flex: 1; min-width: 0; }
#topbar {
  position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 0.8rem;
  padding: 0.65rem 1.6rem; background: rgba(11,10,16,0.92); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
#nav-toggle { display: none; background: var(--panel); border: 1px solid var(--line); color: var(--ink); font-size: 1.05rem; padding: 0.3rem 0.7rem; border-radius: 6px; cursor: pointer; }
.search-wrap { position: relative; flex: 1; max-width: 560px; }
#search {
  width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--bone);
  font-family: var(--serif); font-size: 0.95rem; padding: 0.5rem 0.9rem; border-radius: 8px; outline: none;
}
#search:focus { border-color: var(--veil); }
#search::placeholder { color: var(--ink-faint); font-style: italic; }
#search-results {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 60;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  box-shadow: 0 14px 40px rgba(0,0,0,0.6); max-height: 60vh; overflow-y: auto;
}
#search-results.open { display: block; }
.search-hit { display: block; padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--line); color: var(--ink); }
.search-hit:hover { background: var(--panel2); text-decoration: none; }
.search-hit strong { color: var(--bone); margin-right: 0.6rem; }
.search-hit .dim { font-size: 0.78rem; }
.search-hit .snip { display: block; font-size: 0.8rem; color: var(--ink-faint); margin-top: 2px; }
.topbar-tag { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); white-space: nowrap; }
#page { max-width: 980px; margin: 0 auto; padding: 2rem 2.2rem 5rem; }
.page-head { margin-bottom: 1.4rem; }
.page-section { font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--blood); }
.page-title { font-size: 2.3rem; margin-top: 0.2rem; font-variant: small-caps; letter-spacing: 0.04em; }
footer { border-top: 1px solid var(--line); padding: 1.6rem 2.2rem 2.4rem; color: var(--ink-faint); font-size: 0.82rem; text-align: center; font-style: italic; }

/* ---------- home ---------- */
.hero { text-align: center; padding: 1.5rem 0 0.5rem; }
.hero .sigil { width: 130px; height: 130px; margin: 0 auto 0.8rem; display: block; filter: drop-shadow(0 0 24px rgba(139,123,216,0.25)); }
.kicker { font-size: 0.75rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-faint); }
.hero h1 { font-size: 3rem; font-variant: small-caps; letter-spacing: 0.06em; margin: 0.3rem 0; text-shadow: 0 0 40px rgba(192,57,47,0.3); }
.hero-sub { color: var(--ink-dim); font-size: 1.08rem; }
.hero-sub strong { color: var(--bone); }
.hero-stats { display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap; margin: 1.6rem 0 0.6rem; }
.hero-stats div { text-align: center; }
.hero-stats b { display: block; font-size: 1.9rem; color: var(--gold); }
.hero-stats span { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); }
.quick-links { display: flex; flex-wrap: wrap; gap: 0.8rem; margin: 1.4rem 0; }
.quick-links a { background: var(--panel); border: 1px solid var(--line); padding: 0.55rem 1rem; border-radius: 8px; font-size: 0.92rem; }
.quick-links a:hover { border-color: var(--blood); text-decoration: none; }

/* ---------- triad cards ---------- */
.triad-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin: 1.4rem 0; }
.triad-card { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--tc, var(--line)); border-radius: 10px; padding: 1.1rem 1.2rem; color: var(--ink); }
.triad-card.link:hover { text-decoration: none; border-color: var(--tc); transform: translateY(-2px); transition: 0.15s; }
.triad-card h3 { color: var(--tc); font-size: 1.3rem; font-variant: small-caps; margin-top: 0; }
.triad-card .axis { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); margin: 0.1rem 0 0.6rem; }
.triad-line { font-size: 0.88rem; color: var(--ink-dim); }
.triad-motto { font-style: italic; color: var(--tc); font-size: 0.92rem; }

/* ---------- tables ---------- */
.rules-table { width: 100%; border-collapse: collapse; margin: 0.9rem 0; font-size: 0.93rem; }
.rules-table th { text-align: left; font-variant: small-caps; letter-spacing: 0.05em; color: var(--gold); border-bottom: 2px solid var(--line); padding: 0.5rem 0.7rem; font-size: 0.88rem; }
.rules-table td { border-bottom: 1px solid var(--line); padding: 0.5rem 0.7rem; vertical-align: top; }
.rules-table tr:hover td { background: rgba(255,255,255,0.02); }
.stat-table .totals td { font-size: 1.35rem; color: var(--bone); font-weight: bold; text-align: center; }
.stat-table th { text-align: center; }
.family { margin: 1.8rem 0; border-left: 3px solid var(--tc); padding-left: 1.1rem; }
.family h2 { border: none; margin-top: 0; }
.family h2 a { color: var(--tc); }
.ability-index td { font-size: 0.86rem; }
.glossary td:first-child { white-space: nowrap; }

/* ---------- chips ---------- */
.chip { display: inline-block; background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 0.12rem 0.7rem; font-size: 0.8rem; margin: 0.15rem 0.2rem 0.15rem 0; color: var(--ink); }
.chip.delta { color: var(--gold); border-color: rgba(217,164,65,0.4); }
.chip.cost { color: var(--bone); }
.chip.cd { color: var(--veil); }
.chip.range { color: var(--ink-dim); }
.chip.attr { color: var(--land); }
.triad-badge { background: transparent; border-color: var(--tc); color: var(--tc); font-variant: small-caps; letter-spacing: 0.06em; }
.kind-badge { color: var(--ink-dim); }

/* ---------- class pages ---------- */
.class-hero { border-left: 4px solid var(--tc); padding: 0.4rem 0 0.4rem 1.2rem; margin-bottom: 1.2rem; }
.class-hero h1 { font-size: 2.6rem; font-variant: small-caps; color: var(--bone); margin: 0.3rem 0 0.1rem; }
.class-badges { margin-bottom: 0.2rem; }
.epithet { font-style: italic; color: var(--tc); font-size: 1.1rem; }
.role-line { color: var(--ink-dim); font-size: 0.92rem; }
.crossing-box { background: linear-gradient(90deg, rgba(192,57,47,0.08), transparent); border: 1px solid var(--tc); border-radius: 10px; padding: 0.9rem 1.1rem; margin: 1rem 0; font-size: 0.95rem; }
.trait-card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--tc); border-radius: 8px; padding: 0.9rem 1.1rem; }
.ability { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.2rem; margin: 0.9rem 0; }
.ability.special { border-color: rgba(139,123,216,0.45); background: linear-gradient(135deg, rgba(139,123,216,0.06), var(--panel)); }
.ability-head { display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap; }
.ability-head h3 { margin: 0; font-size: 1.15rem; }
.rank { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); border: 1px solid rgba(217,164,65,0.4); padding: 0.1rem 0.5rem; border-radius: 4px; }
.atype { margin-left: auto; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); }
.ability-meta { margin: 0.5rem 0; }
.horror-line { color: #e0705f; font-size: 0.9rem; }
.flavor { font-style: italic; color: var(--ink-faint); font-size: 0.9rem; }
.lore p { margin: 0.9rem 0; }
.dropcap::first-letter { font-size: 3.1rem; float: left; line-height: 0.85; padding: 0.08em 0.12em 0 0; color: var(--blood); font-weight: bold; }
.lore-quote { border-left: 3px solid var(--blood-deep); margin: 1.6rem 0; padding: 0.6rem 0 0.6rem 1.2rem; font-style: italic; color: var(--bone); font-size: 1.05rem; }
.lore-quote cite { display: block; margin-top: 0.5rem; font-size: 0.85rem; color: var(--ink-faint); font-style: normal; }
.mini-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0.9rem; margin: 1rem 0; }
.mini-card { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--tc); border-radius: 8px; padding: 0.8rem 1rem; color: var(--ink); }
.mini-card:hover { text-decoration: none; border-color: var(--tc); }
.mini-card h3 { margin: 0 0 0.2rem; color: var(--tc); }
.mini-card p { font-size: 0.85rem; margin: 0.2rem 0; }

/* ---------- rules blocks ---------- */
.attr-block { border-left: 3px solid var(--ac); background: var(--panel); border-radius: 8px; padding: 0.8rem 1.1rem; margin: 0.8rem 0; }
.attr-block h3 { color: var(--ac); margin: 0 0 0.2rem; }
.skill-chips { margin-top: 0.4rem; }
.track-block { border: 1px solid var(--line); border-top: 3px solid var(--tc); border-radius: 10px; padding: 1rem 1.3rem; margin: 1.4rem 0; background: var(--panel); }
.track-block h2 { border: none; margin: 0 0 0.3rem; color: var(--tc); }
.track-axis { font-size: 0.8rem; color: var(--ink-faint); font-variant: normal; letter-spacing: 0.1em; text-transform: uppercase; margin-left: 0.6rem; }
.track-triad { font-style: italic; color: var(--ink-dim); }
.steps li { margin: 0.5rem 0; }
.steps li::marker { color: var(--blood); font-weight: bold; }

/* ---------- forge ---------- */
.forge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: start; }
.forge-col h2 { margin-top: 1.4rem; }
.field { margin: 0.7rem 0; }
.field label { display: block; font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 0.25rem; }
select, input[type="text"], input[type="number"] {
  width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--bone);
  font-family: var(--serif); font-size: 0.95rem; padding: 0.45rem 0.7rem; border-radius: 7px; outline: none;
}
select:focus, input:focus { border-color: var(--veil); }
select:disabled { opacity: 0.45; }
input[type="range"] { width: 100%; accent-color: var(--blood); }
.budget { font-size: 0.85rem; color: var(--land); font-variant: normal; letter-spacing: 0; margin-left: 0.5rem; }
.budget.over { color: #ff8f7a; }
.stepper-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.22rem 0; border-bottom: 1px dashed rgba(44,39,64,0.6); font-size: 0.92rem; }
.stepper-row label { flex: 1; min-width: 0; }
.step { width: 26px; height: 26px; background: var(--panel2); border: 1px solid var(--line); color: var(--bone); border-radius: 6px; cursor: pointer; font-size: 1rem; line-height: 1; }
.step:hover { border-color: var(--gold); }
.step-val { width: 30px; text-align: center; color: var(--bone); font-weight: bold; }
.step-cost { width: 48px; text-align: right; color: var(--ink-faint); font-size: 0.8rem; }
.step-eff { width: 42px; text-align: right; color: var(--land); font-size: 0.85rem; }
.bg-tag { color: var(--gold); font-size: 0.72rem; }
.skill-steppers { max-height: 430px; overflow-y: auto; padding-right: 6px; }
.skill-steppers::-webkit-scrollbar { width: 8px; }
.skill-steppers::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.sheet-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.7rem; margin: 0.9rem 0; }
.sheet-stat { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--sc); border-radius: 8px; text-align: center; padding: 0.6rem 0.3rem; }
.sheet-stat b { display: block; font-size: 1.5rem; color: var(--bone); }
.sheet-stat span { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
.sheet-pools { margin: 0.6rem 0; }
.unlocks { list-style: none; margin-left: 0; }
.unlocks li { border-bottom: 1px dashed rgba(44,39,64,0.6); padding: 0.25rem 0; }
.eff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.15rem 1rem; font-size: 0.88rem; margin: 0.6rem 0 1rem; }
.eff-grid div { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(44,39,64,0.6); padding: 0.15rem 0; }
.eff-grid b { color: var(--land); }
.crossing-note { color: #e0705f; }
.btn { background: var(--panel2); border: 1px solid var(--line); color: var(--bone); font-family: var(--serif); font-size: 0.92rem; padding: 0.5rem 1.1rem; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--blood); color: var(--gold); }
.btn.big { font-size: 1.05rem; padding: 0.6rem 1.6rem; background: var(--blood-deep); border-color: var(--blood); }
.btn.big:hover { background: var(--blood); color: var(--bone); }
.btn.tiny { font-size: 0.78rem; padding: 0.25rem 0.6rem; }
.btn.mode.active { border-color: var(--veil); color: var(--veil); }

/* ---------- compare ---------- */
.compare-controls { display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: center; margin: 1rem 0 1.4rem; }
.compare-controls select { width: auto; flex: 1; min-width: 180px; }
.compare-controls label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--ink-dim); }
.compare-controls input[type="range"] { width: 120px; }
.compare-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; align-items: start; }
.compare-col { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--tc); border-radius: 10px; padding: 1rem 1.1rem; }
.compare-col h2 { border: none; margin: 0 0 0.2rem; font-size: 1.3rem; }
.compare-col h2 a { color: var(--tc); }
.compare-col h3 { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); margin: 0.9rem 0 0.25rem; }
.bar { position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; height: 24px; overflow: hidden; }
.bar-fill { height: 100%; opacity: 0.55; }
.bar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: var(--bone); font-weight: bold; }
.compare-minis { margin: 0.7rem 0; }

/* ---------- dice ---------- */
.dice-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1.2rem 1.4rem; margin: 1rem 0; }
.dice-controls { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
.dice-controls label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--ink-dim); }
.dice-controls input[type="number"] { width: 80px; }
.dice-modes { display: flex; gap: 0.4rem; }
.dice-expr-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin: 1rem 0; }
.dice-expr-row input[type="text"] { width: 220px; }
.dice-log { margin-top: 0.8rem; }
.dice-row { display: flex; gap: 1rem; align-items: baseline; padding: 0.45rem 0.6rem; border-bottom: 1px dashed rgba(44,39,64,0.6); font-size: 0.92rem; flex-wrap: wrap; }
.dice-row.latest { background: rgba(217,164,65,0.05); border-radius: 6px; }
.dice-row.crit { background: rgba(138,154,91,0.12); }
.dice-row.fumble { background: rgba(192,57,47,0.12); }
.dice-row.err { color: #ff8f7a; }
.dice-expr { color: var(--ink-dim); min-width: 110px; }
.dice-kept { color: var(--ink-faint); font-family: "Courier New", monospace; font-size: 0.85rem; }
.dice-total { font-size: 1.3rem; font-weight: bold; color: var(--bone); }
.dice-crit { font-size: 0.72rem; letter-spacing: 0.14em; color: var(--gold); }
.dice-row.crit .dice-crit { color: var(--land); }
.dice-row.fumble .dice-crit { color: var(--blood); }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .forge-grid { grid-template-columns: 1fr; }
  .compare-grid { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  #sidebar { position: fixed; left: 0; top: 0; z-index: 80; transform: translateX(-100%); transition: transform 0.2s; box-shadow: 20px 0 60px rgba(0,0,0,0.5); }
  body.nav-open #sidebar { transform: translateX(0); }
  #nav-toggle { display: block; }
  #page { padding: 1.4rem 1.1rem 4rem; }
  .page-title { font-size: 1.8rem; }
  .hero h1 { font-size: 2.1rem; }
  .sheet-stats { grid-template-columns: repeat(2, 1fr); }
  .topbar-tag { display: none; }
}
</style>
</head>
<body>
<div id="layout">
  <aside id="sidebar">
    <div class="side-head">
      <svg viewBox="0 0 120 120" class="sigil" aria-hidden="true">
  <defs><radialGradient id="sg2" cx="50%" cy="45%" r="60%">
    <stop offset="0%" stop-color="#2a2438"/><stop offset="100%" stop-color="#0b0a10"/>
  </radialGradient></defs>
  <circle cx="60" cy="60" r="56" fill="url(#sg2)" stroke="#4a4258" stroke-width="1.5"/>
  <path d="M60 18 L98 86 L22 86 Z" fill="none" stroke="#6f6486" stroke-width="1.5"/>
  <circle cx="60" cy="18" r="7" fill="none" stroke="#8b7bd8" stroke-width="1.5"/>
  <circle cx="60" cy="18" r="2.4" fill="#8b7bd8"/>

    return { section: g.label, color: TRIAD[g.triad].color, items };
  });
  const idx = NAV.findIndex(n => n.section === "The Classes");
  NAV.splice(idx + 1, 0, ...classSections);
}

/* ---------- helpers ---------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const strip = html => String(html).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
function chip(txt, cls) { return `<span class="chip ${cls || ""}">${txt}</span>`; }
function statDelta(v) { return v === 0 ? "" : (v > 0 ? "+" + v : String(v)); }
function lineage(c) {
  if (c.kind === "base") return [c];
  if (c.kind === "path") return [CLASS_BY_ID[c.parent], c];
  return [CLASS_BY_ID[CLASS_BY_ID[c.parent].parent], CLASS_BY_ID[c.parent], c];
}
function lineageTotals(c) {
  const t = { ...CHASSIS };
  lineage(c).forEach(k => { Object.keys(k.stats).forEach(s => t[s] += k.stats[s]); });
  return t;
}
function levelBonuses(c, level) {
  const primary = CLASS_BY_ID[lineage(c)[0].id].primary;
  const b = { hp: 0, mana: 0, stamina: 0, acc: 0 };
  [3, 5, 7, 9].forEach(l => { if (level >= l) { b.hp += 5; b[primary] += 5; } });
  [4, 8].forEach(l => { if (level >= l) b.acc += 1; });
  if (level >= 10) { b.hp += 10; b[primary] += 10; }
  return b;
}
function fullTotals(c, level) {
  const t = lineageTotals(c);
  const b = levelBonuses(c, level);
  t.hp += b.hp; t.mana += b.mana; t.stamina += b.stamina; t.acc += b.acc;
  return t;
}

/* ---------- TOOLS: Character Forge ---------- */
const FORGE = {
  base: "occultist", path: "", hybrid: "", level: 1, armor: "Cloth", background: "",
  attrs: { Body: 0, Agility: 0, Fortitude: 0, Charisma: 0 },
  skills: {}
};
SKILL_TREE.forEach(a => a.skills.forEach(s => FORGE.skills[s] = 0));
INDEPENDENT.forEach(s => FORGE.skills[s] = 0);
const ATTR_BUDGET = 15, SKILL_BUDGET = 35, PT_CAP = 10;
function rankCost(rank) { let c = 0; for (let i = 1; i <= rank; i++) c += COST_LADDER[i - 1].cost; return c; }
function spentAttrs() { return Object.values(FORGE.attrs).reduce((s, r) => s + rankCost(r), 0); }
function spentSkills() { return Object.values(FORGE.skills).reduce((s, r) => s + rankCost(r), 0); }
function bgGrants() {
  const b = BACKGROUNDS.find(x => x.name === FORGE.background);
  if (!b) return {};
  const m = {};
  b.grants.split(",").forEach(g => { const mm = g.trim().match(/\+1 (\w[\w ]*)/); if (mm) m[mm[1]] = 1; });
  return m;
}
function forgeClass() {
  if (FORGE.hybrid) return CLASS_BY_ID[FORGE.hybrid];
  if (FORGE.path) return CLASS_BY_ID[FORGE.path];
  return CLASS_BY_ID[FORGE.base];
}
function forgeTotals() {
  const c = forgeClass();
  const t = fullTotals(c, FORGE.level);
  const armor = ARMOR_RULES.find(a => a.armor === FORGE.armor) || ARMOR_RULES[0];
  t.ac += parseInt(armor.ac) || 0; t.dr += parseInt(armor.dr) || 0;
  const A = FORGE.attrs;
  t.dodge += A.Agility + Math.floor(A.Fortitude / 2) + Math.floor(A.Body / 3);
  t.spelldef = A.Fortitude + Math.floor(A.Body / 2) + Math.floor(A.Agility / 3);
  t.acc += FORGE.skills.Accuracy;
  return t;
}
function effSkill(name) {
  const parent = SKILL_TREE.find(a => a.skills.includes(name));
  const bg = bgGrants()[name] || 0;
  const rank = FORGE.skills[name] + bg;
  if (name === "Accuracy") return CHASSIS.acc + levelBonuses(forgeClass(), FORGE.level).acc + rank;
  return parent ? rank + FORGE.attrs[parent.attr] : rank;
}
function unlocksUpTo(level) {
  return LEVEL_LADDER.filter(l => l.level <= level).map(l => `<li><strong>L${l.level}</strong> — ${l.grant}</li>`).join("");
}

function renderForge() {
  const paths = PATHS.filter(p => p.parent === FORGE.base);
  const hybrids = FORGE.path ? HYBRIDS.filter(h => h.parent === FORGE.path) : [];
  const c = forgeClass();
  const t = forgeTotals();
  const sa = spentAttrs(), ss = spentSkills();
  const attrRows = Object.keys(FORGE.attrs).map(k => {
    const r = FORGE.attrs[k], cost = rankCost(r);
    return `<div class="stepper-row"><label>${k}</label>
      <button class="step" data-forge="attr" data-key="${k}" data-d="-1">−</button>
      <span class="step-val">+${r}</span>
      <button class="step" data-forge="attr" data-key="${k}" data-d="1">+</button>
      <span class="step-cost">${cost} pts</span></div>`;
  }).join("");
  const skillRows = [...SKILL_TREE.flatMap(a => a.skills), ...INDEPENDENT].map(k => {
    const r = FORGE.skills[k], cost = rankCost(r), bg = bgGrants()[k] || 0;
    return `<div class="stepper-row"><label>${k}${bg ? ' <span class="bg-tag">+' + bg + ' bg</span>' : ""}</label>
      <button class="step" data-forge="skill" data-key="${k}" data-d="-1">−</button>
      <span class="step-val">+${r}</span>
      <button class="step" data-forge="skill" data-key="${k}" data-d="1">+</button>
      <span class="step-cost">${cost} pts</span>
      <span class="step-eff">= ${effSkill(k)}</span></div>`;
  }).join("");
  const overA = sa > ATTR_BUDGET, overS = ss > SKILL_BUDGET;
  return `
<p class="lede">Build a legal character: the Forge enforces the 15/35 budgets, the cost ladder, the 10-point caps, level gating and every class delta. Attributes feed skills and defenses — resources come from the class lineage.</p>
<div class="forge-grid">
  <div class="forge-col">
    <h2>1 · Lineage</h2>
    <div class="field"><label>Base class</label><select data-forge="base">${BASES.map(b => `<option value="${b.id}" ${b.id === FORGE.base ? "selected" : ""}>${b.name} — ${TRIAD[b.triad].name}</option>`).join("")}</select></div>
    <div class="field"><label>Progression ${FORGE.level < 2 ? '<span class="dim">(unlocks L2)</span>' : ""}</label>
      <select data-forge="path" ${FORGE.level < 2 ? "disabled" : ""}><option value="">— none —</option>${paths.map(p => `<option value="${p.id}" ${p.id === FORGE.path ? "selected" : ""}>${p.name}</option>`).join("")}</select></div>
    <div class="field"><label>Hybrid (Rite of Crossing) ${FORGE.level < 4 ? '<span class="dim">(unlocks L4)</span>' : ""}</label>
      <select data-forge="hybrid" ${FORGE.level < 4 || !FORGE.path ? "disabled" : ""}><option value="">— none —</option>${hybrids.map(h => `<option value="${h.id}" ${h.id === FORGE.hybrid ? "selected" : ""}>${h.name} × ${TRIAD[h.partner].name}</option>`).join("")}</select></div>
    <div class="field"><label>Level: <strong id="forge-level-label">${FORGE.level}</strong></label>
      <input type="range" min="1" max="10" value="${FORGE.level}" data-forge="level"></div>
    <div class="field"><label>Background</label><select data-forge="background"><option value="">— none —</option>${BACKGROUNDS.map(b => `<option ${b.name === FORGE.background ? "selected" : ""}>${b.name}</option>`).join("")}</select></div>
    <div class="field"><label>Armor</label><select data-forge="armor">${ARMOR_RULES.map(a => `<option ${a.armor === FORGE.armor ? "selected" : ""}>${a.armor}</option>`).join("")}</select>
      <p class="dim small">Class proficiency: ${c.armor}. Non-proficient: AC bonus halved, Stealth penalty doubled (apply manually).</p></div>
    <h2>2 · Attributes <span class="budget ${overA ? "over" : ""}">${sa}/${ATTR_BUDGET}</span></h2>

    <h2>3 · Skills <span class="budget ${overS ? "over" : ""}">${ss}/${SKILL_BUDGET}</span></h2>
    <div class="skill-steppers">${skillRows}</div>
    ${overS ? '<p class="warn">Over budget — allocation rejected at save.</p>' : ""}
    <p class="dim small">Cap: 10 points spent per attribute/skill (max rank +5 at creation). Background grants are fixed and free. Accuracy & Initiative have no attribute parent.</p>
  </div>
  <div class="forge-col">
    <h2>Sheet — ${c.name} <span class="dim">L${FORGE.level}</span></h2>
    <div class="sheet-stats">
      ${[["HP", t.hp, "#c0392f"], ["Mana", t.mana, "#8b7bd8"], ["Stamina", t.stamina, "#d9a441"], ["AC", t.ac, "#9aa5b1"], ["DR", t.dr, "#9aa5b1"], ["Accuracy", "+" + t.acc, "#5ba88a"], ["Dodge Def", t.dodge, "#5ba88a"], ["Spell Def", t.spelldef, "#5ba88a"]].map(s =>
        `<div class="sheet-stat" style="--sc:${s[2]}"><b>${s[1]}</b><span>${s[0]}</span></div>`).join("")}
    </div>
    <div class="sheet-pools">${chip("2 AP / turn")}${chip("1 Mov / turn")}${chip("1 SP / turn")}${chip("Fear 0/100")}${chip("Sanity 100/100")}${chip("Corruption 0/100")}</div>
    <h3>Trait — ${c.trait.name}</h3><p class="small">${c.trait.text}</p>
    ${FORGE.hybrid ? `<p class="small crossing-note">Crossing price paid: <strong>${CROSSING_COSTS[CLASS_BY_ID[FORGE.hybrid].partner].delta}</strong>.</p>` : ""}
    <h3>Unlocked so far</h3><ul class="small unlocks">${unlocksUpTo(FORGE.level)}</ul>
    <h3>Effective skills</h3>
    <div class="eff-grid">${[...SKILL_TREE.flatMap(a => a.skills), ...INDEPENDENT].map(k => `<div><span>${k}</span><b>${effSkill(k)}</b></div>`).join("")}</div>
    <button class="btn" id="forge-copy">Copy build as JSON</button>
    <span id="forge-copy-msg" class="dim small"></span>
  </div>
</div>`;
}

/* ---------- TOOLS: Compare ---------- */
const COMPARE = { a: "occultist", b: "skinwalker", c: "landsworn", level: 10 };
function renderCompare() {
  const opts = sel => CLASSES.map(c => `<option value="${c.id}" ${c.id === sel ? "selected" : ""}>${c.name} (${KIND_LABEL[c.kind]})</option>`).join("");
  const cols = ["a", "b", "c"].map(k => CLASS_BY_ID[COMPARE[k]]);
  const totals = cols.map(c => fullTotals(c, COMPARE.level));
  const maxes = { hp: Math.max(...totals.map(t => t.hp)), mana: Math.max(...totals.map(t => t.mana)), stamina: Math.max(...totals.map(t => t.stamina)) };
  const bar = (v, max, color) => `<div class="bar"><div class="bar-fill" style="width:${Math.round(100 * v / max)}%;background:${color}"></div><span>${v}</span></div>`;
  return `
<p class="lede">Three classes side by side — a triad, naturally. Totals include the full lineage (base + progression + hybrid) at the chosen level, before armor and attributes.</p>
<div class="compare-controls">
  ${["a", "b", "c"].map(k => `<select data-compare="${k}">${opts(COMPARE[k])}</select>`).join("")}
  <label>Level <input type="range" min="1" max="10" value="${COMPARE.level}" data-compare="level"> <strong>${COMPARE.level}</strong></label>
</div>
<div class="compare-grid">
${cols.map((c, i) => {
  const t = totals[i], tr = TRIAD[c.triad];
  return `<div class="compare-col" style="--tc:${tr.color}">
    <h2><a href="#/class-${c.id}">${c.name}</a></h2>
    <p class="dim">${c.epithet}<br>${KIND_LABEL[c.kind]} · ${tr.name} · ${c.role}</p>
    <p class="small">Lineage: ${lineage(c).map(k => k.name).join(" + ")}</p>
    <h3>HP</h3>${bar(t.hp, maxes.hp, "#c0392f")}
    <h3>Mana</h3>${bar(t.mana, maxes.mana, "#8b7bd8")}
    <h3>Stamina</h3>${bar(t.stamina, maxes.stamina, "#d9a441")}
    <div class="compare-minis">${chip("AC " + t.ac)}${chip("DR " + t.dr)}${chip("Acc +" + t.acc)}${chip("Dodge +" + t.dodge)}</div>
    <h3>Trait — ${c.trait.name}</h3><p class="small">${c.trait.text}</p>
    <h3>Abilities</h3>
    <ul class="small">${c.abilities.map(a => `<li><strong>${a.name}</strong> <span class="dim">(${a.rank}, ${a.type}, ${a.cost}${a.cd ? ", CD " + a.cd : ""})</span></li>`).join("")}</ul>
    <h3>Weapons</h3><p class="small">${c.weapons.map(w => w.name).join(" · ")}</p>
    <p class="small"><strong>Armor:</strong> ${c.armor} · <strong>Attributes:</strong> ${c.attributes.join(", ")}</p>
  </div>`;
}).join("")}
</div>`;
}

/* ---------- TOOLS: Dice ---------- */
const DICE = { mod: 0, mode: "normal", log: [] };
function rollDie(n) { return 1 + Math.floor(Math.random() * n); }
function rollD20() {
  const r1 = rollDie(20), r2 = rollDie(20);
  let nat = r1, kept = [r1];
  if (DICE.mode === "adv") { nat = Math.max(r1, r2); kept = [r1, r2]; }
  if (DICE.mode === "dis") { nat = Math.min(r1, r2); kept = [r1, r2]; }
  const total = nat + DICE.mod;
  const crit = nat === 20 ? "CRITICAL HIT" : nat === 1 ? "CRITICAL MISS" : "";
  DICE.log.unshift({ expr: `d20${DICE.mod >= 0 ? "+" : ""}${DICE.mod}${DICE.mode !== "normal" ? " (" + DICE.mode + ")" : ""}`, kept, nat, total, crit });
  DICE.log = DICE.log.slice(0, 12);
  paintDiceResult();
}
function rollExpr(expr) {
  const m = expr.trim().match(/^(\d*)d(\d+)\s*([+-]\s*\d+)?$/i);
  if (!m) { DICE.log.unshift({ expr, error: "Use XdY+Z (e.g. 2d3+4)" }); paintDiceResult(); return; }
  const n = parseInt(m[1] || "1"), faces = parseInt(m[2]), bonus = m[3] ? parseInt(m[3].replace(/\s/g, "")) : 0;
  if (n < 1 || n > 20 || faces < 2 || faces > 100) { DICE.log.unshift({ expr, error: "1–20 dice, d2–d100" }); paintDiceResult(); return; }
  const rolls = Array.from({ length: n }, () => rollDie(faces));
  const total = rolls.reduce((a, b) => a + b, 0) + bonus;
  DICE.log.unshift({ expr, kept: rolls, total, bonus });
  DICE.log = DICE.log.slice(0, 12);
  paintDiceResult();
}
function paintDiceResult() {
  const el = $("#dice-log");
  if (!el) return;
  el.innerHTML = DICE.log.map((r, i) => r.error
    ? `<div class="dice-row err"><span class="dice-expr">${esc(r.expr)}</span><span>${r.error}</span></div>`
    : `<div class="dice-row ${i === 0 ? "latest" : ""} ${r.crit === "CRITICAL HIT" ? "crit" : r.crit === "CRITICAL MISS" ? "fumble" : ""}">
      <span class="dice-expr">${esc(r.expr)}</span>
      <span class="dice-kept">[${r.kept.join(", ")}]${r.bonus ? (r.bonus > 0 ? " +" + r.bonus : " " + r.bonus) : ""}</span>
      <span class="dice-total">${r.total}</span>
      ${r.crit ? `<span class="dice-crit">${r.crit}</span>` : ""}
    </div>`).join("") || '<p class="dim">No rolls yet. The Mists are listening.</p>';
}
function renderDice() {
  return `
<p class="lede">The system's dice: 1d20 + modifier for attacks and checks (advantage/disadvantage = 2d20 keep high/low), XdY+Z for damage. Natural 20 doubles the gross damage package; natural 1 always misses.</p>
<div class="dice-panel">
  <div class="dice-controls">
    <label>Modifier <input type="number" id="dice-mod" value="${DICE.mod}" min="-20" max="30"></label>
    <div class="dice-modes">
      ${["normal", "adv", "dis"].map(m => `<button class="btn mode ${DICE.mode === m ? "active" : ""}" data-dice-mode="${m}">${m === "normal" ? "Normal" : m === "adv" ? "Advantage" : "Disadvantage"}</button>`).join("")}
    </div>
    <button class="btn big" id="dice-roll">Roll d20</button>
  </div>
  <div class="dice-expr-row">
    <input type="text" id="dice-expr" placeholder="Damage expression, e.g. 2d3+4" value="1d4+3">
    <button class="btn" id="dice-expr-roll">Roll</button>
    ${["1d3", "1d4", "2d3", "1d6", "1d8", "2d6", "1d4+3", "2d3+4"].map(e => `<button class="btn tiny" data-dice-quick="${e}">${e}</button>`).join("")}
  </div>
  <div id="dice-log" class="dice-log"></div>
</div>
<p class="note">Damage quick-reference: unarmed 1d3+Str · one-handed 1d4+Str · two-handed 2d3+Str · bow 1d4+Body · thrown 1d4+Str · Magic Bolt 1d8. Subtract DR once, after the crit multiplier.</p>`;
}

/* ---------- router ---------- */
function pageContent(id) {
  if (id === "home") return { title: "The Triad System", section: "Welcome", body: renderHome(), raw: true };
  if (id === "classes-index") return { title: "All 21 Classes", section: "The Classes", body: renderClassesIndex(), raw: true };
  if (id === "appendix-abilities") return { title: "Ability Index", section: "Appendix", body: renderAbilityIndex(), raw: true };
  if (id === "tools-forge") return { title: "Character Forge", section: "Tools", body: renderForge(), raw: true };
  if (id === "tools-compare") return { title: "Compare Classes", section: "Tools", body: renderCompare(), raw: true };
  if (id === "tools-dice") return { title: "Dice Roller", section: "Tools", body: renderDice(), raw: true };
  if (id.startsWith("class-")) {
    const c = CLASS_BY_ID[id.slice(6)];
    if (c) return { title: c.name, section: TRIAD[c.triad].name + " · " + KIND_LABEL[c.kind], body: renderClass(c), raw: true, triad: c.triad };
  }
  if (PAGES[id]) return { ...PAGES[id], raw: true };
  return { title: "Lost in the Mists", section: "404", body: `<p class="lede">This page drifted beyond the borders. <a href="#/home">Return to the waystone</a>.</p>`, raw: true };
}

let CURRENT = "home";
function navigate() {
  let id = (location.hash || "#/home").replace(/^#\//, "") || "home";
  CURRENT = id;
  const p = pageContent(id);
  document.title = p.title + " · Ravenloft Triad Wiki";
  $("#page").innerHTML = `<div class="page-head"><span class="page-section">${p.section}</span><h1 class="page-title">${p.title}</h1></div>${p.body}`;
  $("#page").scrollTop = 0;
  window.scrollTo(0, 0);
  document.querySelectorAll("#sidebar a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#/" + id));
  bindPageHandlers(id);
  closeSidebar();
}

/* ---------- page event bindings ---------- */
function bindPageHandlers(id) {
  if (id === "tools-forge") {
    document.querySelectorAll("[data-forge]").forEach(el => {
      const kind = el.dataset.forge;
      if (el.tagName === "SELECT" || el.type === "range") {
        el.addEventListener("input", () => {
          if (kind === "base") { FORGE.base = el.value; FORGE.path = ""; FORGE.hybrid = ""; }
          if (kind === "path") { FORGE.path = el.value; FORGE.hybrid = ""; }
          if (kind === "hybrid") FORGE.hybrid = el.value;
          if (kind === "level") {
            FORGE.level = parseInt(el.value);
            if (FORGE.level < 2) FORGE.path = "";
            if (FORGE.level < 4) FORGE.hybrid = "";
          }
          if (kind === "background") FORGE.background = el.value;
          if (kind === "armor") FORGE.armor = el.value;
          navigate();
        });
      } else if (el.tagName === "BUTTON" && el.classList.contains("step")) {
        el.addEventListener("click", () => {
          const key = el.dataset.key, d = parseInt(el.dataset.d);
          const store = kind === "attr" ? FORGE.attrs : FORGE.skills;
          const next = store[key] + d;
          if (next < 0 || next > 8) return;
          if (rankCost(next) > PT_CAP) return;
          store[key] = next;
          navigate();
        });
      }
    });
    const copy = $("#forge-copy");
    if (copy) copy.addEventListener("click", () => {
      const c = forgeClass();
      const build = { system: "ravenloft-triad", class: c.id, lineage: lineage(c).map(k => k.id), level: FORGE.level, background: FORGE.background || null, armor: FORGE.armor, attributes: FORGE.attrs, skills: FORGE.skills, budgets: { attributes: spentAttrs() + "/" + ATTR_BUDGET, skills: spentSkills() + "/" + SKILL_BUDGET }, totals: forgeTotals(), effectiveSkills: Object.fromEntries([...SKILL_TREE.flatMap(a => a.skills), ...INDEPENDENT].map(k => [k, effSkill(k)])) };
      const txt = JSON.stringify(build, null, 2);
      const done = () => { $("#forge-copy-msg").textContent = "Copied — paste into your RPR ledger or FlowChart defs."; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
      else fallbackCopy(txt, done);
    });
  }
  if (id === "tools-compare") {
    document.querySelectorAll("[data-compare]").forEach(el => el.addEventListener("input", () => {
      const k = el.dataset.compare;
      if (k === "level") COMPARE.level = parseInt(el.value); else COMPARE[k] = el.value;
      navigate();
    }));
  }
  if (id === "tools-dice") {
    $("#dice-mod").addEventListener("input", e => DICE.mod = parseInt(e.target.value) || 0);
    document.querySelectorAll("[data-dice-mode]").forEach(b => b.addEventListener("click", () => { DICE.mode = b.dataset.diceMode; navigate(); }));
    $("#dice-roll").addEventListener("click", rollD20);
    $("#dice-expr-roll").addEventListener("click", () => rollExpr($("#dice-expr").value));
    $("#dice-expr").addEventListener("keydown", e => { if (e.key === "Enter") rollExpr(e.target.value); });
    document.querySelectorAll("[data-dice-quick]").forEach(b => b.addEventListener("click", () => { $("#dice-expr").value = b.dataset.diceQuick; rollExpr(b.dataset.diceQuick); }));
    paintDiceResult();
  }
}
function fallbackCopy(txt, done) {
  const ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { $("#forge-copy-msg").textContent = "Copy blocked by sandbox — select the JSON manually."; }
  document.body.removeChild(ta);
}

/* ---------- sidebar & search ---------- */
function renderSidebar() {
  $("#sidebar-nav").innerHTML = NAV.map(g => `
    <div class="nav-group">
      <div class="nav-section" ${g.color ? `style="color:${g.color}"` : ""}>${g.section}</div>
      ${g.items.map(([id, label]) => `<a href="#/${id}" class="${id.startsWith("class-") && CLASS_BY_ID[id.slice(6)]?.kind === "hybrid" ? "nav-hybrid" : ""}">${label}</a>`).join("")}
    </div>`).join("");
}
let SEARCH_INDEX = [];
function buildSearchIndex() {
  SEARCH_INDEX = [];
  const add = (id, title, section, text) => SEARCH_INDEX.push({ id, title, section, text: (title + " " + text).toLowerCase() });
  add("home", "The Triad System", "Welcome", strip(renderHome()));
  add("classes-index", "All 21 Classes", "The Classes", strip(renderClassesIndex()));
  Object.entries(PAGES).forEach(([id, p]) => add(id, p.title, p.section, strip(p.body)));
  CLASSES.forEach(c => add("class-" + c.id, c.name, TRIAD[c.triad].name + " · " + KIND_LABEL[c.kind],
    strip(renderClass(c)) + " " + c.weapons.map(w => w.name).join(" ")));
  add("appendix-abilities", "Ability Index", "Appendix", strip(renderAbilityIndex()));
  add("tools-forge", "Character Forge", "Tools", "build calculator attributes skills budget stats");
  add("tools-compare", "Compare Classes", "Tools", "compare side by side stats");
  add("tools-dice", "Dice Roller", "Tools", "d20 roll advantage disadvantage damage");
}
function doSearch(q) {
  const box = $("#search-results");
  q = q.trim().toLowerCase();
  if (q.length < 2) { box.innerHTML = ""; box.classList.remove("open"); return; }
  const terms = q.split(/\s+/);
  const hits = SEARCH_INDEX.map(e => {
    let score = 0;
    terms.forEach(t => {
      if (e.title.toLowerCase().includes(t)) score += 10;
      const idx = e.text.indexOf(t);
      if (idx >= 0) score += 3;
    });
    return { ...e, score };
  }).filter(e => e.score > 0).sort((a, b) => b.score - a.score).slice(0, 10);
  box.innerHTML = hits.length
    ? hits.map(h => {
      const idx = h.text.indexOf(terms[0]);
      const snip = idx >= 0 ? "…" + h.text.slice(Math.max(0, idx - 30), idx + 70) + "…" : h.text.slice(0, 90) + "…";
      return `<a href="#/${h.id}" class="search-hit"><strong>${h.title}</strong><span class="dim">${h.section}</span><span class="snip">${esc(snip)}</span></a>`;
    }).join("")
    : '<div class="search-hit dim">Nothing found. The Mists keep their secrets.</div>';
  box.classList.add("open");
}
function closeSidebar() { document.body.classList.remove("nav-open"); }

/* ---------- boot ---------- */
function boot() {
  renderSidebar();
  buildSearchIndex();
  $("#search").addEventListener("input", e => doSearch(e.target.value));
  $("#search").addEventListener("focus", e => { if (e.target.value) doSearch(e.target.value); });
  document.addEventListener("click", e => {
    if (!e.target.closest(".search-wrap")) $("#search-results").classList.remove("open");
    if (e.target.closest("#sidebar a")) closeSidebar();
  });
  $("#nav-toggle").addEventListener("click", () => document.body.classList.toggle("nav-open"));
  window.addEventListener("hashchange", navigate);
  navigate();
}
document.addEventListener("DOMContentLoaded", boot);
</script>
